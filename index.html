<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>伊豆・靜岡自駕遊 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #F8FAFC; color: #0F172A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .jp-card { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 0.75rem; box-shadow: 0 2px 8px -2px rgba(15, 23, 42, 0.05); }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-20 pt-3 max-w-md mx-auto px-4 space-y-3">

    <!-- 雲端同步狀態提示 -->
    <div id="sync-status" class="bg-blue-900 text-white text-[11px] py-1.5 px-3 rounded-xl flex items-center justify-between shadow-sm">
        <span class="flex items-center gap-1.5 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span>伊豆靜岡自駕遊 2026 (單機/就緒)</span>
        </span>
    </div>

    <!-- 1. 頂部標題與氣象 -->
    <section class="jp-card p-4 relative overflow-hidden border-slate-200 bg-gradient-to-br from-blue-50/60 to-orange-50/40">
        <div class="relative z-10 space-y-2">
            <div class="text-xs font-black text-orange-600 tracking-wide flex items-center gap-1.5">
                <span>2026年 12/3 - 12/8 6天5夜</span>
            </div>
            
            <h1 class="text-xl font-black tracking-tight">伊豆・靜岡自駕遊</h1>

            <div class="flex items-center justify-between pt-2 border-t border-slate-200/80 text-xs gap-2">
                <div class="flex items-center gap-1 font-medium">
                    <span class="text-[11px] opacity-70">地區</span>
                    <select id="weather-location" onchange="updateWeather()" class="bg-white border border-slate-300 rounded px-1.5 py-0.5 text-xs font-bold outline-none cursor-pointer">
                        <option value="yokohama">橫濱</option>
                        <option value="izukogen">伊豆高原</option>
                        <option value="shuzenji">修善寺</option>
                        <option value="shizuoka">靜岡</option>
                    </select>
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="flex items-center gap-1 font-bold bg-white px-2 py-0.5 rounded border border-slate-200">
                        <span id="weather-icon">晴朗</span>
                        <span id="weather-temp" class="text-blue-600 font-extrabold">14°C</span>
                    </div>
                    <div class="flex items-center gap-1 font-bold bg-orange-50 px-2 py-0.5 rounded border border-orange-200">
                        <span class="text-[10px] text-orange-600">富士山:</span>
                        <span id="fuji-visibility" class="text-orange-600 font-extrabold">極佳 🗻</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 2. 主頁籤切換 -->
    <div class="grid grid-cols-4 bg-slate-200 p-1 rounded-xl text-xs font-bold gap-1 text-center">
        <button onclick="switchMainTab('itinerary')" id="tab-btn-itinerary" class="py-2 rounded-lg transition text-blue-950 bg-white shadow-sm">行程</button>
        <button onclick="switchMainTab('hotel')" id="tab-btn-hotel" class="py-2 rounded-lg transition opacity-70">航班住宿</button>
        <button onclick="switchMainTab('expense')" id="tab-btn-expense" class="py-2 rounded-lg transition opacity-70">記帳</button>
        <button onclick="switchMainTab('todolist')" id="tab-btn-todolist" class="py-2 rounded-lg transition opacity-70">清單</button>
    </div>

    <!-- PANEL 1: 行程 -->
    <section id="panel-itinerary" class="space-y-3">
        <div class="flex justify-between items-center jp-card p-2.5 rounded-xl">
            <span class="text-xs font-bold opacity-80 pl-1">選擇天數</span>
            <button onclick="openAddModal()" class="bg-blue-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1">
                <span class="text-orange-400 font-black">+</span> 新增行程
            </button>
        </div>

        <div id="day-tabs" class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none"></div>
        <div id="itinerary-timeline" class="space-y-3 relative pl-3 border-l-2 border-orange-500 ml-2 my-2"></div>
    </section>

    <!-- PANEL 2: 航班與住宿 -->
    <section id="panel-hotel" class="space-y-4 hidden">
        <div class="jp-card p-2.5 rounded-xl text-xs font-bold">航班與住宿資訊總覽</div>
        
        <div class="space-y-2.5">
            <h3 class="text-xs font-extrabold uppercase tracking-wider pl-1">航班資訊</h3>
            <div class="jp-card p-3.5 space-y-2 text-xs">
                <div class="flex justify-between items-center border-b border-slate-100 pb-1.5 font-bold">
                    <span>去程 1 (12/03)</span>
                    <span class="text-[10px] bg-orange-100 text-orange-800 px-2 py-0.5 rounded">JX314</span>
                </div>
                <div class="flex justify-between items-center font-bold">
                    <span class="text-sm">09:15 台中 T2</span>
                    <span class="opacity-60 text-[11px]">3h 10m</span>
                    <span class="text-sm">13:25 成田 T2</span>
                </div>
            </div>
            <div class="jp-card p-3.5 space-y-2 text-xs">
                <div class="flex justify-between items-center border-b border-slate-100 pb-1.5 font-bold">
                    <span>回程 (12/08)</span>
                    <span class="text-[10px] bg-orange-100 text-orange-800 px-2 py-0.5 rounded">CX505</span>
                </div>
                <div class="flex justify-between items-center font-bold">
                    <span class="text-sm">18:10 成田 T2</span>
                    <span class="opacity-60 text-[11px]">5h 20m</span>
                    <span class="text-sm">22:30 香港 T1</span>
                </div>
            </div>
        </div>

        <div class="space-y-2.5 pt-1">
            <h3 class="text-xs font-extrabold uppercase tracking-wider pl-1">住宿飯店安排</h3>
            <div id="hotels-container" class="space-y-2.5"></div>
        </div>
    </section>

    <!-- PANEL 3: 記帳 -->
    <section id="panel-expense" class="space-y-3 hidden">
        <div class="jp-card p-4 bg-slate-900 text-white space-y-2">
            <div class="text-xs text-slate-300 font-medium flex justify-between items-center">
                <span>旅行總支出</span>
                <span class="w-2 h-2 rounded-full bg-orange-500"></span>
            </div>
            <div class="space-y-1">
                <div id="expense-total-jpy" class="text-2xl font-black text-orange-400">¥0 JPY</div>
            </div>
        </div>

        <button onclick="openExpenseModal()" class="w-full py-2.5 bg-orange-600 text-white font-bold text-xs rounded-xl shadow-md">新增記帳</button>
        <div id="expense-list" class="space-y-2"></div>
    </section>

    <!-- PANEL 4: 待辦清單 -->
    <section id="panel-todolist" class="space-y-3 hidden">
        <div class="flex justify-between items-center jp-card p-2.5 rounded-xl">
            <span class="text-xs font-bold">準備與預返項目</span>
            <button onclick="openTodoModal()" class="bg-blue-900 text-white px-3 py-1 rounded-lg text-xs font-bold">新增項目</button>
        </div>
        <div id="todo-items" class="space-y-2"></div>
    </section>

    <!-- Modal 區塊 -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center px-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="font-bold text-sm">新增行程</h3>
                <button onclick="closeModal()" class="text-slate-400 font-bold">✕</button>
            </div>
            <form id="itinerary-form" onsubmit="saveItinerary(event)" class="space-y-2.5 text-xs">
                <div>
                    <label class="block font-bold mb-1">天數</label>
                    <select id="form-day" class="w-full bg-slate-50 border rounded-lg p-2 font-medium">
                        <option value="1">Day 1 (12/03 三)</option>
                        <option value="2">Day 2 (12/04 四)</option>
                        <option value="3">Day 3 (12/05 五)</option>
                        <option value="4">Day 4 (12/06 六)</option>
                        <option value="5">Day 5 (12/07 日)</option>
                        <option value="6">Day 6 (12/08 一)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold mb-1">時間</label>
                        <input type="text" id="form-time" placeholder="例: 09:15" class="w-full bg-slate-50 border rounded-lg p-2 font-medium">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">類別</label>
                        <select id="form-tag" class="w-full bg-slate-50 border rounded-lg p-2 font-medium">
                            <option value="景點">景點</option>
                            <option value="交通">交通</option>
                            <option value="美食">美食</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block font-bold mb-1">名稱 *</label>
                    <input type="text" id="form-title" required placeholder="行程名稱" class="w-full bg-slate-50 border rounded-lg p-2 font-medium">
                </div>
                <div>
                    <label class="block font-bold mb-1">備註</label>
                    <textarea id="form-desc" rows="2" placeholder="詳細說明..." class="w-full bg-slate-50 border rounded-lg p-2 font-medium resize-none"></textarea>
                </div>
                <div>
                    <label class="block font-bold mb-1">地圖關鍵字</label>
                    <input type="text" id="form-map" placeholder="例: 橫濱車站" class="w-full bg-slate-50 border rounded-lg p-2 font-medium">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 py-2 bg-slate-100 font-bold rounded-xl">取消</button>
                    <button type="submit" class="flex-1 py-2 bg-blue-900 text-white font-bold rounded-xl">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 記帳 Modal -->
    <div id="modal-expense-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center px-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="font-bold text-sm">新增支出</h3>
                <button onclick="closeExpenseModal()" class="text-slate-400 font-bold">✕</button>
            </div>
            <form onsubmit="saveExpense(event)" class="space-y-2.5 text-xs">
                <div>
                    <label class="block font-bold mb-1">名稱 *</label>
                    <input type="text" id="expense-title" required placeholder="例: 晚餐" class="w-full bg-slate-50 border rounded-lg p-2 font-medium">
                </div>
                <div>
                    <label class="block font-bold mb-1">金額 (JPY) *</label>
                    <input type="number" id="expense-amount" required placeholder="金額" class="w-full bg-slate-50 border rounded-lg p-2 font-medium">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeExpenseModal()" class="flex-1 py-2 bg-slate-100 font-bold rounded-xl">取消</button>
                    <button type="submit" class="flex-1 py-2 bg-orange-600 text-white font-bold rounded-xl">新增</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 待辦 Modal -->
    <div id="modal-todo-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center px-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="font-bold text-sm">新增準備項目</h3>
                <button onclick="closeTodoModal()" class="text-slate-400 font-bold">✕</button>
            </div>
            <form onsubmit="saveTodo(event)" class="space-y-2.5 text-xs">
                <div>
                    <label class="block font-bold mb-1">項目名稱 *</label>
                    <input type="text" id="todo-text" required placeholder="例: 網卡購買" class="w-full bg-slate-50 border rounded-lg p-2 font-medium">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeTodoModal()" class="flex-1 py-2 bg-slate-100 font-bold rounded-xl">取消</button>
                    <button type="submit" class="flex-1 py-2 bg-blue-900 text-white font-bold rounded-xl">新增</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const weatherData = {
            yokohama: { temp: '14°C', icon: '晴朗', fuji: '極佳 🗻' },
            izukogen: { temp: '15°C', icon: '晴朗', fuji: '良好 🏔️' },
            shuzenji: { temp: '12°C', icon: '多雲', fuji: '普通 ☁️' },
            shizuoka: { temp: '16°C', icon: '晴朗', fuji: '絕佳 🗻' }
        };

        const dayDates = { 1: '12/03 三', 2: '12/04 四', 3: '12/05 五', 4: '12/06 六', 5: '12/07 日', 6: '12/08 一' };
        let currentDay = 1;

        let itineraries = [
            { id: 1, day: 1, time: '09:15-13:25', title: '台中飛往成田機場 (JX314)', tag: '航班', desc: '機場尋找寄行李服務', map: '成田機場' },
            { id: 2, day: 1, time: '14:30', title: "搭乘 N'EX 前往橫濱", tag: '交通', desc: '直達橫濱車站', map: '橫濱車站' },
            { id: 3, day: 1, time: '16:00', title: 'Check in JR東日本橫濱METS飯店', tag: '住宿', desc: '辦理入住', map: 'JR東日本橫濱METS飯店' },
            { id: 4, day: 2, time: '10:00', title: '取租車並開往伊豆', tag: '交通', desc: '自駕前往伊豆半島', map: '伊豆' }
        ];

        const hotelsList = [
            { name: 'JR東日本橫濱METS飯店', kana: 'JR東日本ホテルメッツ 横浜', desc: '神奈川縣橫濱市神奈川區鶴屋町1-66-9', dates: '12月3日 - 12月4日 (1晚)' },
            { name: '稻取銀水莊', kana: '稲取銀水荘', desc: '靜岡縣賀茂郡東伊豆町稻取', dates: '12月4日 - 12月5日 (1晚)' },
            { name: '天城路旅館', kana: '天城路旅館', desc: '靜岡縣伊豆市 Ichiyama 578-6', dates: '12月5日 - 12月6日 (1晚)' },
            { name: 'Ole Inn 酒店', kana: 'ホテルオーレ イン', desc: '靜岡縣靜岡市葵區', dates: '12月6日 - 12月8日 (2晚)' }
        ];

        let expenses = [];
        let todos = [
            { id: 1, text: '護照正本與有效期限確認', completed: true },
            { id: 2, text: '日本網卡 / eSIM 購買', completed: false }
        ];

        function updateWeather() {
            const loc = document.getElementById('weather-location').value;
            const data = weatherData[loc];
            document.getElementById('weather-temp').innerText = data.temp;
            document.getElementById('weather-icon').innerText = data.icon;
            document.getElementById('fuji-visibility').innerText = data.fuji;
        }

        function switchMainTab(tab) {
            ['itinerary', 'hotel', 'expense', 'todolist'].forEach(t => {
                document.getElementById(`panel-${t}`).classList.add('hidden');
                document.getElementById(`tab-btn-${t}`).className = "py-2 rounded-lg transition opacity-70 font-bold";
            });
            document.getElementById(`panel-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tab}`).className = "py-2 rounded-lg transition font-bold bg-white shadow-sm opacity-100";

            if(tab === 'hotel') renderHotels();
            if(tab === 'expense') renderExpenses();
            if(tab === 'todolist') renderTodos();
        }

        function renderDayTabs() {
            const container = document.getElementById('day-tabs');
            let html = '';
            for (let i = 1; i <= 6; i++) {
                const active = i === currentDay ? 'border-b-2 border-orange-500 font-black opacity-100' : 'opacity-60';
                html += `<button onclick="selectDay(${i})" class="px-3 py-1 text-xs font-bold whitespace-nowrap transition ${active}">Day ${i} (${dayDates[i]})</button>`;
            }
            container.innerHTML = html;
        }

        function selectDay(day) { currentDay = day; renderDayTabs(); renderItinerary(); }

        function renderItinerary() {
            const container = document.getElementById('itinerary-timeline');
            const filtered = itineraries.filter(i => Number(i.day) === currentDay);
            if (filtered.length === 0) {
                container.innerHTML = `<div class="jp-card p-5 text-center text-xs opacity-60 ml-1">本日尚無行程，點擊上方新增</div>`;
                return;
            }
            container.innerHTML = filtered.map(item => {
                const mapBtn = item.map ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map)}" target="_blank" class="text-xs text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded border border-blue-200">地圖</a>` : '';
                return `
                    <div class="relative pl-3">
                        <div class="absolute -left-[16px] top-3.5 w-2.5 h-2.5 rounded-full bg-orange-500 border-2 border-white"></div>
                        <div class="jp-card p-3.5 space-y-1.5">
                            <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
                                <span class="text-xs font-bold">${item.time || '全天'}</span>
                                <div class="flex items-center gap-2 text-xs">
                                    ${mapBtn}
                                    <button onclick="deleteItinerary(${item.id})" class="text-rose-500 font-bold">刪除</button>
                                </div>
                            </div>
                            <h3 class="font-bold text-sm">${item.title}</h3>
                            ${item.desc ? `<p class="text-xs opacity-75">${item.desc}</p>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openAddModal() { document.getElementById('modal-backdrop').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal-backdrop').classList.add('hidden'); }

        function saveItinerary(e) {
            e.preventDefault();
            const data = {
                id: Date.now(),
                day: Number(document.getElementById('form-day').value),
                time: document.getElementById('form-time').value,
                title: document.getElementById('form-title').value,
                desc: document.getElementById('form-desc').value,
                map: document.getElementById('form-map').value
            };
            itineraries.push(data);
            closeModal();
            selectDay(data.day);
        }

        function deleteItinerary(id) {
            itineraries = itineraries.filter(i => i.id !== id);
            renderItinerary();
        }

        function renderHotels() {
            document.getElementById('hotels-container').innerHTML = hotelsList.map(h => `
                <div class="jp-card p-3.5 space-y-1.5 text-xs">
                    <h4 class="font-bold text-sm">${h.name}</h4>
                    <div class="opacity-80">地址: ${h.desc}</div>
                    <div class="font-bold">日期: ${h.dates}</div>
                </div>
            `).join('');
        }

        function renderExpenses() {
            let total = 0;
            expenses.forEach(e => total += Number(e.amount) || 0);
            document.getElementById('expense-total-jpy').innerText = `¥${total.toLocaleString()} JPY`;
            document.getElementById('expense-list').innerHTML = expenses.length === 0 ? `<div class="jp-card p-4 text-center text-xs opacity-60">尚無記帳紀錄</div>` : expenses.map(e => `
                <div class="jp-card p-3 flex justify-between items-center text-xs">
                    <div class="font-bold text-sm">${e.title}</div>
                    <span class="font-black text-orange-600">¥${Number(e.amount).toLocaleString()}</span>
                </div>
            `).join('');
        }

        function openExpenseModal() { document.getElementById('modal-expense-backdrop').classList.remove('hidden'); }
        function closeExpenseModal() { document.getElementById('modal-expense-backdrop').classList.add('hidden'); }
        function saveExpense(e) {
            e.preventDefault();
            expenses.push({ id: Date.now(), title: document.getElementById('expense-title').value, amount: document.getElementById('expense-amount').value });
            closeExpenseModal();
            renderExpenses();
        }

        function renderTodos() {
            document.getElementById('todo-items').innerHTML = todos.map(t => `
                <div class="jp-card p-3 flex justify-between items-center text-xs">
                    <span class="font-bold ${t.completed ? 'line-through opacity-40' : ''}">${t.text}</span>
                </div>
            `).join('');
        }

        function openTodoModal() { document.getElementById('modal-todo-backdrop').classList.remove('hidden'); }
        function closeTodoModal() { document.getElementById('modal-todo-backdrop').classList.add('hidden'); }
        function saveTodo(e) {
            e.preventDefault();
            todos.push({ id: Date.now(), text: document.getElementById('todo-text').value, completed: false });
            closeTodoModal();
            renderTodos();
        }

        window.onload = function() {
            renderDayTabs();
            renderItinerary();
        };
    </script>
</body>
</html>
